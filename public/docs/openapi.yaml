      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Название бренда. Must not be greater than 255 characters.'
                  example: Michelin
                slug:
                  type: string
                  description: 'URL-псевдоним бренда. Must not be greater than 255 characters.'
                  example: michelin
                logo:
                  type: string
                  format: binary
                  description: 'Файл логотипа бренда (jpeg, png, webp, до 10 МБ). Must be a file. Must be an image. Must not be greater than 10240 kilobytes.'
                  nullable: true
                description:
                  type: string
                  description: 'Описание бренда.'
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                type:
                  type: string
                  description: 'Тип товаров бренда: tire, wheel или both.'
                  example: tire
                  enum:
                    - tire
                    - wheel
                    - both
              required:
                - name
                - slug
                - type
    delete:
      summary: 'Удалить бренд.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: ''
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Невозможно удалить бренд: 5 товаров использует его.'
                properties:
                  message:
                    type: string
                    example: 'Невозможно удалить бренд: 5 товаров использует его.'
      tags:
        - Бренды
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the brand.'
        example: architecto
        required: true
        schema:
          type: string
  /api/admin/catalog/suppliers:
    get:
      summary: ''
      operationId: getApiAdminCatalogSuppliers
