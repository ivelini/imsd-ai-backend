                    - asc
                    - desc
                  nullable: true
                search:
                  type: string
                  description: 'Поиск по названию склада. Must not be greater than 100 characters.'
                  example: Основной
                  nullable: true
    post:
      summary: ''
      operationId: postApiAdminCatalogWarehouses
      description: ''
      parameters: []
      responses: {}
      tags:
