      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: 'Номер страницы. Must be at least 1.'
                  example: 1
                  nullable: true
                per_page:
                  type: integer
                  description: 'Элементов на странице (10–100). Must be at least 10. Must not be greater than 100.'
                  example: 50
                  nullable: true
                sort_by:
                  type: string
                  description: 'Поле сортировки: id, name, code, created_at.'
                  example: name
                  enum:
                    - id
                    - name
                    - code
                    - created_at
                  nullable: true
                sort_dir:
                  type: string
                  description: 'Направление сортировки: asc или desc.'
                  example: asc
                  enum:
                    - asc
                    - desc
                  nullable: true
                search:
                  type: string
                  description: 'Поиск по названию или коду поставщика. Must not be greater than 100 characters.'
                  example: Шины
                  nullable: true
    post:
      summary: ''
      operationId: postApiAdminCatalogSuppliers
      description: ''
      parameters: []
      responses: {}
      tags:
        - Поставщики
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Название поставщика. Must not be greater than 255 characters.'
                  example: 'ООО Шины-Опт'
                code:
                  type: string
                  description: 'Код поставщика. Must not be greater than 50 characters.'
                  example: SUP-001
                  nullable: true
              required:
                - name
  '/api/admin/catalog/suppliers/{id}':
    get:
      summary: ''
      operationId: getApiAdminCatalogSuppliersId
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
