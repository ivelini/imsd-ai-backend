openapi: 3.0.3
info:
  title: 'Laravel — Admin API'
  description: 'Административная панель интернет-магазина шин и дисков.'
  version: 1.0.0
servers:
  - url: 'http://localhost:8081'
tags:
  - name: Аутентификация
    description: ''
  - name: Бренды
    description: ''
  - name: Поставщики
    description: ''
  - name: Склады
    description: ''
  - name: 'Импорт шин'
    description: ''
  - name: 'Импорт дисков'
    description: ''
  - name: Акции
    description: ''
  - name: Диски
    description: ''
  - name: Изображения
    description: ''
  - name: Импорт
    description: ''
  - name: 'Импорт точек выдачи'
    description: ''
  - name: Каталог
    description: ''
  - name: 'Правила наценки'
    description: ''
  - name: Справочники
    description: ''
  - name: Страны
    description: ''
  - name: Шины
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Авторизация через Sanctum-токен. Получить: `POST /api/admin/login` с email и password.'
security:
  -
    default: []
paths:
  /api/admin/login:
    post:
      summary: 'Вход в админ-панель.'
      operationId: ''
      description: 'Возвращает Sanctum-токен для авторизации в остальных эндпоинтах.'
      parameters: []
      responses: {}
      tags:
        - Аутентификация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email администратора. Must be a valid email address.'
                  example: admin@example.com
                password:
                  type: string
                  description: Пароль.
                  example: secret123
              required:
                - email
                - password
      security: []
  /api/admin/logout:
    post:
      summary: 'Выход из админ-панели.'
      operationId: ''
      description: 'Удаляет текущий Sanctum-токен.'
      parameters: []
      responses: {}
      tags:
        - Аутентификация
  /api/admin/me:
    get:
      summary: 'Профиль администратора.'
      operationId: ''
      description: 'Возвращает данные текущего авторизованного администратора.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Аутентификация
  /api/admin/catalog/brands:
    get:
      summary: 'Список брендов.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Бренды
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: 'Номер страницы. Must be at least 1.'
                  example: 1
                  nullable: true
                per_page:
                  type: integer
                  description: 'Элементов на странице (10–100). Must be at least 10. Must not be greater than 100.'
                  example: 50
                  nullable: true
                sort_by:
                  type: string
                  description: 'Поле сортировки: id, name, type, created_at.'
                  example: name
                  enum:
                    - id
                    - name
                    - type
                    - created_at
                  nullable: true
                sort_dir:
                  type: string
                  description: 'Направление сортировки: asc или desc.'
                  example: asc
                  enum:
                    - asc
                    - desc
                  nullable: true
                search:
                  type: string
                  description: 'Поиск по названию бренда. Must not be greater than 100 characters.'
                  example: Cordiant
                  nullable: true
                type:
                  type: string
                  description: 'Тип товаров бренда: tire, wheel, both.'
                  example: tire
                  enum:
                    - tire
                    - wheel
                    - both
                  nullable: true
    post:
      summary: 'Создать бренд.'
      operationId: ''
      description: ''
      parameters: []
      responses: {}
      tags:
        - Бренды
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Название бренда. Must not be greater than 255 characters.'
                  example: Michelin
                slug:
                  type: string
                  description: 'URL-псевдоним бренда. Must not be greater than 255 characters.'
                  example: michelin
                logo:
                  type: string
                  description: 'URL логотипа бренда. Must not be greater than 255 characters.'
                  example: b
                  nullable: true
                description:
                  type: string
                  description: 'Описание бренда.'
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                type:
                  type: string
                  description: 'Тип товаров бренда: tire, wheel или both.'
                  example: tire
                  enum:
                    - tire
                    - wheel
                    - both
              required:
                - name
                - slug
                - type
  '/api/admin/catalog/brands/{id}':
    get:
      summary: 'Получить бренд.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Бренды
    put:
      summary: 'Обновить бренд.'
      operationId: ''
      description: ''
      parameters: []
      responses: {}
      tags:
        - Бренды
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Название бренда. Must not be greater than 255 characters.'
                  example: Michelin
                slug:
                  type: string
                  description: 'URL-псевдоним бренда. Must not be greater than 255 characters.'
                  example: michelin
                logo:
                  type: string
                  description: 'URL логотипа бренда. Must not be greater than 255 characters.'
                  example: b
                  nullable: true
                description:
                  type: string
                  description: 'Описание бренда.'
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                type:
                  type: string
                  description: 'Тип товаров бренда: tire, wheel или both.'
                  example: tire
                  enum:
                    - tire
                    - wheel
                    - both
              required:
                - name
                - slug
                - type
    delete:
      summary: 'Удалить бренд.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        204:
          description: ''
          content:
            text/plain:
              schema:
                type: string
                example: ''
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Невозможно удалить бренд: 5 товаров использует его.'
                properties:
                  message:
                    type: string
                    example: 'Невозможно удалить бренд: 5 товаров использует его.'
      tags:
        - Бренды
    parameters:
      -
        in: path
        name: id
        description: 'The ID of the brand.'
        example: architecto
        required: true
        schema:
          type: string
  /api/admin/catalog/suppliers:
    get:
      summary: ''
      operationId: getApiAdminCatalogSuppliers
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
