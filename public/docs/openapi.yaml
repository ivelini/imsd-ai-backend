servers:
  - url: 'http://localhost:8081'
tags:
  - name: Аутентификация
    description: ''
  - name: Бренды
    description: ''
  - name: Поставщики
    description: ''
  - name: Склады
    description: ''
  - name: 'Импорт шин'
    description: ''
  - name: 'Импорт дисков'
    description: ''
  - name: Endpoints
    description: ''
  - name: Акции
    description: ''
  - name: Города
    description: ''
  - name: 'Графики отгрузки'
    description: ''
  - name: Диски
    description: ''
  - name: Изображения
    description: ''
  - name: Импорт
    description: ''
  - name: 'Импорт моделей'
    description: ''
  - name: 'Импорт точек выдачи'
    description: ''
  - name: Каталог
    description: ''
  - name: 'Каталог — диски'
    description: ''
  - name: 'Каталог — шины'
    description: ''
  - name: Модели
    description: ''
  - name: 'Правила наценки'
    description: ''
  - name: 'Правила наценки городов'
    description: ''
  - name: 'Складские остатки'
    description: ''
  - name: Справочники
    description: ''
  - name: Страны
    description: ''
  - name: 'Точки выдачи'
    description: ''
  - name: Уведомления
    description: ''
  - name: Шины
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Авторизация через Sanctum-токен. Получить: `POST /api/admin/login` с email и password.'
security:
  -
    default: []
paths:
  /api/admin/login:
    post:
      summary: 'Вход в админ-панель.'
      operationId: ''
      description: 'Возвращает Sanctum-токен для авторизации в остальных эндпоинтах.'
      parameters: []
      responses: {}
      tags:
        - Аутентификация
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email администратора. Must be a valid email address.'
                  example: admin@example.com
                password:
                  type: string
                  description: Пароль.
                  example: secret123
              required:
                - email
                - password
      security: []
  /api/admin/logout:
    post:
      summary: 'Выход из админ-панели.'
      operationId: ''
      description: 'Удаляет текущий Sanctum-токен.'
      parameters: []
      responses: {}
      tags:
        - Аутентификация
  /api/admin/me:
    get:
      summary: 'Профиль администратора.'
      operationId: ''
      description: 'Возвращает данные текущего авторизованного администратора.'
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Аутентификация
  /api/admin/catalog/brands:
    get:
      summary: 'Список брендов.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Бренды
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: 'Номер страницы. Must be at least 1.'
                  example: 1
                  nullable: true
                per_page:
                  type: integer
                  description: 'Элементов на странице (10–100). Must be at least 10. Must not be greater than 100.'
                  example: 50
                  nullable: true
                sort_by:
                  type: string
                  description: 'Поле сортировки: id, name, type, created_at.'
                  example: name
                  enum:
                    - id
                    - name
                    - type
                    - created_at
                  nullable: true
                sort_dir:
                  type: string
                  description: 'Направление сортировки: asc или desc.'
                  example: asc
                  enum:
                    - asc
                    - desc
                  nullable: true
                search:
                  type: string
                  description: 'Поиск по названию бренда. Must not be greater than 100 characters.'
                  example: Cordiant
                  nullable: true
                type:
                  type: string
                  description: 'Тип товаров бренда: tire, wheel, both.'
                  example: tire
                  enum:
                    - tire
                    - wheel
                    - both
                  nullable: true
    post:
      summary: 'Создать бренд.'
      operationId: ''
      description: ''
      parameters: []
      responses: {}
      tags:
        - Бренды
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Название бренда. Must not be greater than 255 characters.'
                  example: Michelin
                slug:
                  type: string
                  description: 'URL-псевдоним бренда. Must not be greater than 255 characters.'
                  example: michelin
                logo:
                  type: string
                  format: binary
                  description: 'Файл логотипа бренда (jpeg, png, webp, до 10 МБ). Must be a file. Must be an image. Must not be greater than 10240 kilobytes.'
                  nullable: true
                description:
                  type: string
                  description: 'Описание бренда.'
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                type:
                  type: string
                  description: 'Тип товаров бренда: tire, wheel или both.'
                  example: tire
                  enum:
                    - tire
                    - wheel
                    - both
              required:
                - name
                - slug
                - type
  '/api/admin/catalog/brands/{id}':
    get:
      summary: 'Получить бренд.'
      operationId: ''
      description: ''
      parameters: []
      responses:
        401:
