                per_page:
                  type: integer
                  description: 'Элементов на странице (10–100). Must be at least 10. Must not be greater than 100.'
                  example: 50
                  nullable: true
                sort_by:
                  type: string
                  description: 'Поле сортировки: id, name, type, value, starts_at, ends_at, created_at.'
                  example: starts_at
                  enum:
                    - id
                    - name
                    - type
                    - value
                    - starts_at
                    - ends_at
                    - created_at
                  nullable: true
                sort_dir:
                  type: string
                  description: 'Направление сортировки: asc или desc.'
                  example: desc
                  enum:
                    - asc
                    - desc
                  nullable: true
                search:
                  type: string
                  description: 'Поиск по названию акции. Must not be greater than 100 characters.'
                  example: распродажа
                  nullable: true
                type:
                  type: string
                  description: 'Тип акции: percent, fixed, gift, special.'
                  example: percent
                  enum:
                    - percent
                    - fixed
                    - gift
                    - special
                  nullable: true
                promotable_type:
                  type: string
                  description: 'Тип объекта акции: tire, wheel, brand.'
                  example: tire
                  enum:
                    - tire
                    - wheel
                    - brand
                  nullable: true
                is_active:
                  type: boolean
                  description: 'Фильтр: сейчас активна (starts_at <= now <= ends_at).'
                  example: true
                  nullable: true
    post:
      summary: ''
      operationId: postApiAdminCatalogPromotions
      description: ''
      parameters: []
      responses: {}
      tags:
        - Акции
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Название акции. Must not be greater than 255 characters.'
                  example: 'Летняя распродажа'
                description:
                  type: string
                  description: 'Описание акции.'
                  example: 'Eius et animi quos velit et.'
                  nullable: true
                type:
                  type: string
                  description: 'Тип акции: percent, fixed, gift или special.'
                  example: percent
                  enum:
                    - percent
                    - fixed
                    - gift
                    - special
                value:
                  type: number
                  description: 'Значение акции (процент или сумма). Must be at least 0.'
                  example: 15.0
                  nullable: true
                starts_at:
                  type: string
                  description: 'Дата и время начала акции. Must be a valid date.'
                  example: '2026-08-01T00:00:00'
                ends_at:
                  type: string
                  description: 'Дата и время окончания акции. Must be a valid date. Must be a date after or equal to <code>starts_at</code>.'
                  example: '2026-08-31T23:59:59'
                promotable_type:
                  type: string
                  description: 'Тип объекта акции: tire, wheel или brand.'
                  example: tire
                  enum:
                    - tire
                    - wheel
                    - brand
                  nullable: true
                promotable_id:
                  type: integer
                  description: 'ID объекта акции. This field is required when <code>promotable_type</code> is present.'
                  example: 1
                  nullable: true
              required:
                - name
                - type
                - starts_at
                - ends_at
