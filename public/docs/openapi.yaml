  /api/admin/catalog/tires/import:
    post:
      summary: 'Загрузить XLSX-файл с шинами.'
      operationId: XLSX
      description: ''
      parameters: []
      responses:
        202:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    import_id: 1
                properties:
                  data:
                    type: object
                    properties:
                      import_id:
                        type: integer
                        example: 1
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The given data was invalid.'
                  errors:
                    file:
                      - 'Допустим только формат XLSX.'
                properties:
                  message:
                    type: string
                    example: 'The given data was invalid.'
                  errors:
                    type: object
                    properties:
                      file:
                        type: array
                        example:
                          - 'Допустим только формат XLSX.'
                        items:
                          type: string
      tags:
        - 'Импорт шин'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'XLSX-файл (макс. 50 МБ).'
              required:
                - file
  /api/admin/catalog/wheels/import:
    post:
      summary: 'Загрузить XLSX-файл с дисками.'
      operationId: XLSX
      description: ''
      parameters: []
      responses:
        202:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    import_id: 1
                properties:
                  data:
                    type: object
                    properties:
                      import_id:
                        type: integer
                        example: 1
      tags:
        - 'Импорт дисков'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'XLSX-файл (макс. 50 МБ).'
              required:
                - file
  /api/admin/catalog/promotions:
    get:
      summary: ''
      operationId: getApiAdminCatalogPromotions
      description: ''
      parameters: []
      responses:
        401:
          description: ''
          content:
            application/json:
              schema:
